[project]
name = "lego-scanner"
version = "1.0"
description = "Erkennt Lego-Steine auf Bildern und gleicht sie mit Lego-Sets ab"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=2.0.0",
    "plotly>=7.1.0",
    "streamlit>=1.66.1",
    "torch>=2.15.0",
    "torchvision>=0.29.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lego_scanner"]
